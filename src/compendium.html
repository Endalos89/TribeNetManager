<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TribeNet Manager · Compendium</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="compendium.css" />
  <link rel="stylesheet" href="compendium-pricing.css" />
  <link rel="stylesheet" href="compendium-expansion.css" />
  <link rel="stylesheet" href="compendium-research-v2.css" />
</head>
<body>
  <div class="comp-shell">
    <header class="app-header">
      <div>
        <div class="brand">TribeNet Compendium</div>
        <div class="version" id="compVersion">Mandate reference</div>
      </div>
      <div class="header-actions">
        <span class="comp-source" id="compSource"></span>
        <button id="compBackButton" class="button" disabled title="Return to the previous Compendium article">← Back</button>
        <button class="button" onclick="location.href='index.html'">← Launcher</button>
      </div>
    </header>

    <main class="comp-layout">
      <aside class="comp-sidebar">
        <div class="comp-search-wrap">
          <input id="compSearch" class="comp-search" type="search" placeholder="Search skills, research, items, buildings, ships, rules…" autocomplete="off" />
        </div>
        <nav id="compNav" class="comp-nav"></nav>
      </aside>

      <section class="comp-main">
        <div class="comp-breadcrumbs" id="compBreadcrumbs">Compendium</div>
        <article id="compArticle" class="comp-article">
          <div class="comp-loading">Loading TribeNet compendium…</div>
        </article>
      </section>
    </main>
  </div>
  <script src="fair-price-data.js"></script>
  <script src="research-data.js"></script>

  <script src="research-v2-batch-03.js"></script>
  <script src="research-v2-batch-04.js"></script>
  <script src="research-v2-batch-05.js"></script>
  <script src="research-v2-batch-06.js"></script>
  <script src="orders-reference-data.js"></script>
  <script src="orders-reference-skills.js"></script>
  <script src="orders-reference-goods-1.js"></script>

  <script src="orders-reference-final.js"></script>
  <script src="compendium.js"></script>
  <script src="compendium-pricing.js"></script>
  <script src="compendium-data-expansion.js"></script>
  <script src="compendium-categories.js"></script>
