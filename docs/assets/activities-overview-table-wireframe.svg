ext><line x1="35" y1="639" x2="1371" y2="639" stroke="#dce4ee" stroke-width="1"/><rect x="35" y="688" width="1336" height="70" rx="8" fill="#edf5ff" stroke="#dbe7f8" stroke-width="1"/><text x="56" y="714" fill="#2f62b9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" text-anchor="start">Edit loads the selected record into Menu 3's allocation editor; changes refresh this saved list.</text><text x="56" y="738" fill="#62718a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Derived orders are viewed in their source planner. Removing a running draft does not silently delete its goal.</text><text x="35" y="804" fill="#62718a" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start">Sample rows and quantities only. All actual saved orders are read from the Mapper database.</text></svg>
