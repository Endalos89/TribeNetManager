al,sans-serif">Confirmed stock</text><text x="59" y="504" font-size="23" fill="#1d2b46" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">62</text><text x="346" y="476" font-size="13" fill="#65758b" font-weight="400" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Remaining to target</text><text x="346" y="504" font-size="23" fill="#1d2b46" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">38</text><text x="681" y="476" font-size="13" fill="#65758b" font-weight="400" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Expected this turn</text><text x="681" y="504" font-size="21" fill="#3260b5" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">+25 (estimate)</text><text x="42" y="576" font-size="13" fill="#65758b" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">OPTIONAL TURN LIMITS</text><rect x="38" y="589" width="1124" height="91" rx="11" fill="#ffffff" stroke="#dde5ee" stroke-width="1"/><text x="60" y="623" font-size="14" fill="#1d2b46" font-weight="650" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Maximum workers this turn</text><rect x="360" y="604" width="155" height="41" rx="11" fill="#ffffff" stroke="#dde5ee" stroke-width="1"/><text x="378" y="632" font-size="16" fill="#1d2b46" font-weight="650" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">30  ▾</text><text x="569" y="623" font-size="13" fill="#65758b" font-weight="400" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Subject to skill / building / inventory / higher-priority limits</text><rect x="38" y="705" width="1124" height="70" rx="10" fill="#eef8f2" stroke="#d2ebdc" stroke-width="1"/><text x="58" y="730" font-size="14" fill="#15724c" font-weight="650" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">PREVIEW  •  25 workers available for this order; projected +25 planks; target may need more turns.</text><text x="58" y="75