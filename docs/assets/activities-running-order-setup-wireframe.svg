<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="859" viewBox="0 0 1200 859" role="img" aria-labelledby="title description"><title id="title">Menu 3 running order setup</title><desc id="description">One Turn versus Running Order toggle; Maintain Stock mode; explicit product target and inventory counting scope, preview and per-turn worker cap.</desc><rect x="0" y="0" width="1200" height="859" rx="0" fill="#f6f8fb" stroke="#f6f8fb" stroke-width="1"/><text x="39" y="47" font-size="13" fill="#3260b5" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">MENU 3 / 3  —  ALLOCATION</text><text x="39" y="79" font-size="27" fill="#1d2b46" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Woodwork → Make planks</text><text x="39" y="105" font-size="13" fill="#65758b" font-weight="400" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Illustrative running-order setup — not verified game data</text><rect x="38" y="127" width="1124" height="68" rx="11" fill="#ffffff" stroke="#dde5ee" stroke-width="1"/><text x="58" y="153" font-size="12" fill="#65758b" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">ORDER BEHAVIOUR</text><rect x="58" y="164" width="224" height="24" rx="6" fill="#ffffff" stroke="#dde5ee" stroke-width="1"/><text x="90" y="181" font-size="14" fill="#65758b" font-weight="600" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">○  One Turn</text><rect x="295" y="160" width="277" height="30" rx="8" fill="#edf4ff" stroke="#3260b5" stroke-width="1.5"/><text x="325" y="180" font-size="14" fill="#3260b5" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">●  Running Order</text><rect x="38" y="212" width="1124" height="92" rx="11" fill="#ffffff" stroke="#dde5ee" stroke-width="1"/><text x="59" y="237" font-size="12" fill="#65758b" font-weight="700" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">RUNNING MODE</text><rect x="59"