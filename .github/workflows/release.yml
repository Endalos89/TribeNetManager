name: Build Windows release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run regression tests
        run: |
          npm test
          node tests/skill-overhaul-category-c1.test.js
          node tests/skill-overhaul-category-c2.test.js
          node tests/skill-overhaul-category-c3.test.js

      - name: Assign release version
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and publish Windows installer
        if: github.event_name != 'pull_request'
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
