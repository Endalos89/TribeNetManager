name: Build Windows release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Rapid mapper fixes must not publish an older installer after a newer one.
concurrency:
  group: tribenet-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run regression tests
        shell: bash
        run: |
          set -e
          npm test
          node tests/terrain-mesh-disk-cache.test.js
          node tests/results-playback.test.js
          node tests/results-transition.test.js
          node tests/results-start-state.test.js
          node tests/feedback-round5.test.js
          node tests/skill-overhaul-category-c1.test.js
          node tests/skill-overhaul-category-c2.test.js
          node tests/skill-overhaul-category-c3.test.js
          node tests/skill-overhaul-category-c4.test.js
          node tests/skill-overhaul-category-c5-final.test.js

      - name: Check real 3D Mapper terrain rendering
        run: |
          npm install --no-save playwright
          node tests/mapper-visible-terrain.browser.test.js
          node tests/mapper-hydration-startup.browser.test.js
          node tests/mapper-historical-hydration.browser.test.js

      - name: Assign release version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          npm version $version --no-git-tag-version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows installer
        run: npm run dist -- --publish never

      - name: Stage release candidate and build the next version for repeat-update testing
        shell: pwsh
        run: |
          $stagedRelease = Join-Path $env:RUNNER_TEMP "TribeNetManager-release-$env:APP_VERSION"
          New-Item -ItemType Directory -Path $stagedRelease -Force | Out-Null
          foreach ($asset in @("TribeNet Manager Setup $env:APP_VERSION.exe", "TribeNet Manager Setup $env:APP_VERSION.exe.blockmap", 'latest.yml')) {
            $assetPath = Join-Path 'release' $asset
            if (!(Test-Path $assetPath)) { throw "First candidate asset not found: $assetPath" }
            Copy-Item $assetPath $stagedRelease -Force
          }

          $nextVersion = "0.1.$([int]${{ github.run_number }} + 1)"
          npm version $nextVersion --no-git-tag-version
          "APP_TEST_VERSION=$nextVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build next-version Windows installer for repeat-update testing
        run: npm run dist -- --publish never

      - name: Test upgrade from the latest released installer
        shell: pwsh
        run: ./tests/windows-installer-upgrade.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore release candidate assets
        shell: pwsh
        run: |
          $stagedRelease = Join-Path $env:RUNNER_TEMP "TribeNetManager-release-$env:APP_VERSION"
          Copy-Item (Join-Path $stagedRelease "TribeNet Manager Setup $env:APP_VERSION.exe") release -Force
          Copy-Item (Join-Path $stagedRelease "TribeNet Manager Setup $env:APP_VERSION.exe.blockmap") release -Force
          Copy-Item (Join-Path $stagedRelease 'latest.yml') release -Force

      - name: Tag tested release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $tag = "v$env:APP_VERSION"
          $existingTag = git tag --list $tag
          if ($existingTag) {
            $tagCommit = git rev-parse "$tag^{}"
            $headCommit = git rev-parse HEAD
            if ($tagCommit -ne $headCommit) { throw "Tag $tag already points to $tagCommit, not $headCommit." }
          } else {
            git tag $tag
          }
          git push origin $tag

      - name: Publish tested Windows installer assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $tag = "v$env:APP_VERSION"
          $installer = "release/TribeNet Manager Setup $env:APP_VERSION.exe"
          $blockmap = "$installer.blockmap"
          $latestYml = "release/latest.yml"

          if (!(Test-Path $installer)) { throw "Built installer not found: $installer" }
          if (!(Test-Path $blockmap)) { throw "Built blockmap not found: $blockmap" }
          if (!(Test-Path $latestYml)) { throw "Updater manifest not found: $latestYml" }

          $manifest = Get-Content $latestYml -Raw
          $pathMatch = [regex]::Match($manifest, '(?m)^path:\s*(.+?)\s*$')
          if (!$pathMatch.Success) { throw "Updater manifest does not declare its installer path." }
          $downloadName = $pathMatch.Groups[1].Value.Trim('"', "'")
          if ([IO.Path]::GetFileName($downloadName) -ne $downloadName) { throw "Unsafe installer path in updater manifest: $downloadName" }

          $downloadInstaller = "release/$downloadName"
          $downloadBlockmap = "$downloadInstaller.blockmap"
          Copy-Item $installer $downloadInstaller -Force
          Copy-Item $blockmap $downloadBlockmap -Force

          gh release create $tag $downloadInstaller $downloadBlockmap $latestYml --repo Endalos89/TribeNetManager --title $env:APP_VERSION --verify-tag --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub release asset upload failed." }

          $assetNames = gh release view $tag --repo Endalos89/TribeNetManager --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Could not verify published GitHub release assets." }
          foreach ($requiredAsset in @($downloadName, "$downloadName.blockmap", "latest.yml")) {
            if ($assetNames -notcontains $requiredAsset) { throw "Release $tag is missing required asset $requiredAsset." }
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
